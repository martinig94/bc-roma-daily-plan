[project]
name = "bc-roma-daily-plan"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
